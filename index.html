<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Robot Builder in plain HTML, CSS, and JavaScript." />
  <title>Robot Builder</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>
  <div id="icon-sprite-host" class="sr-only" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
      <symbol id="icon-scene" viewBox="0 0 24 24">
        <path d="M3 19h18v2H3zM4 5l4 3 4-5 4 4 4-2v12H4z" />
      </symbol>
      <symbol id="icon-color" viewBox="0 0 24 24">
        <path d="M12 2c4 4 8 8 8 12a8 8 0 1 1-16 0c0-4 4-8 8-12zm0 3.3c-2.5 2.9-5 5.8-5 8.7a5 5 0 1 0 10 0c0-2.9-2.5-5.8-5-8.7z" />
      </symbol>
      <symbol id="icon-size" viewBox="0 0 24 24">
        <path d="M3 10V3h7v2H6.4L11 9.6 9.6 11 5 6.4V10zM21 14v7h-7v-2h3.6L13 14.4 14.4 13 19 17.6V14z" />
      </symbol>
      <symbol id="icon-mix" viewBox="0 0 24 24">
        <path d="M3 5h7v7H3zM14 5h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" />
      </symbol>
      <symbol id="icon-move" viewBox="0 0 24 24">
        <path d="M12 2l3 3h-2v4h-2V5H9zM12 22l-3-3h2v-4h2v4h2zM2 12l3-3v2h4v2H5v2zM22 12l-3 3v-2h-4v-2h4V9z" />
      </symbol>
      <symbol id="icon-dance" viewBox="0 0 24 24">
        <path d="M13 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10 6h3l2 4-2 1-1-2v4l3 2v6h-2v-5l-3-2-2 3H6l2-4 2-2V6z" />
      </symbol>
      <symbol id="icon-hide" viewBox="0 0 24 24">
        <path d="M12 5c5.2 0 9 4.4 10 7-1 2.6-4.8 7-10 7S3 14.6 2 12c1-2.6 4.8-7 10-7zm0 3a4 4 0 1 0 .001 8.001A4 4 0 0 0 12 8z" />
      </symbol>
      <symbol id="icon-type" viewBox="0 0 24 24">
        <path d="M4 4h16v4h-6v12h-4V8H4zM5 15h4v5H5zM15 15h4v5h-4z" />
      </symbol>
    </svg>
  </div>

  <div id="app" class="app-shell">
    <header class="app-header">
      <button id="name-button" class="name-plate" type="button" aria-label="Change robot name" data-testid="name-button">
        <span class="name-led" aria-hidden="true"></span>
        <span id="name-text" class="name-text">Loading</span>
        <span class="name-led" aria-hidden="true"></span>
      </button>
      <button id="emotion-button" class="emotion-button" type="button" aria-label="Change robot emotion" data-testid="emotion-button">
        <span id="emotion-text" class="emotion-text">:)</span>
      </button>
    </header>

    <main class="app-main">
      <section id="stage-region" class="stage-region" aria-label="Robot stage" data-testid="stage-region">
        <div id="scene-background" class="scene-layer scene-background" aria-hidden="true"></div>
        <div id="stage-overlay" class="stage-overlay" aria-hidden="true"></div>
        <div id="scene-foreground" class="scene-layer scene-foreground" aria-hidden="true"></div>

        <div id="robot-mover" class="robot-mover">
          <div id="robot-dancer" class="robot-dancer">
            <div id="robot-assembly" class="robot-assembly" data-testid="robot-assembly">
              <button id="part-head" class="part-button part-head" type="button" aria-label="Cycle robot head" data-part="head" data-testid="part-head"></button>

              <div class="part-row part-middle-row">
                <button id="part-arm-left" class="part-button part-arm" type="button" aria-label="Cycle robot arms" data-part="arms" data-side="left" data-testid="part-arm-left"></button>
                <button id="part-body" class="part-button part-body" type="button" aria-label="Cycle robot body" data-part="body" data-testid="part-body">
                  <div id="exhaust-container" class="exhaust-container" aria-hidden="true"></div>
                </button>
                <button id="part-arm-right" class="part-button part-arm" type="button" aria-label="Cycle robot arms" data-part="arms" data-side="right" data-testid="part-arm-right"></button>
              </div>

              <div class="part-row part-legs-row">
                <button id="part-leg-left" class="part-button part-leg" type="button" aria-label="Cycle robot legs" data-part="legs" data-side="left" data-testid="part-leg-left"></button>
                <button id="part-leg-right" class="part-button part-leg" type="button" aria-label="Cycle robot legs" data-part="legs" data-side="right" data-testid="part-leg-right"></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside id="hide-seek-hud" class="hide-seek-hud is-hidden" aria-live="polite" data-testid="hide-seek-hud">
        <span class="hud-label">Hide and Seek</span>
        <span class="hud-stat" id="hide-seek-timer" data-testid="hide-seek-timer">15</span>
        <span class="hud-stat" id="hide-seek-score" data-testid="hide-seek-score">0</span>
      </aside>

      <nav id="controls" class="controls" aria-label="Robot controls" data-testid="controls"></nav>
    </main>

    <div id="toast" class="toast is-hidden" role="status" aria-live="polite" data-testid="toast"></div>
    <p id="status-live" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </div>

  <script defer src="./app.js"></script>
</body>
</html>
