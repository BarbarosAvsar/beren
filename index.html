<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Robot Builder in plain HTML, CSS, and JavaScript." />
  <title>Robot Builder</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <button id="name-button" class="name-plate" type="button" aria-label="Change robot name" data-testid="name-button">
        <span class="name-led" aria-hidden="true"></span>
        <span id="name-text" class="name-text">Loading</span>
        <span class="name-led" aria-hidden="true"></span>
      </button>
      <button id="emotion-button" class="emotion-button" type="button" aria-label="Change robot emotion" data-testid="emotion-button">
        <span id="emotion-text" class="emotion-text">:)</span>
      </button>
    </header>

    <main class="app-main">
      <section id="stage-region" class="stage-region" aria-label="Robot stage" data-testid="stage-region">
        <div id="scene-layer" class="scene-layer" aria-hidden="true"></div>
        <div id="stage-overlay" class="stage-overlay" aria-hidden="true"></div>

        <div id="robot-mover" class="robot-mover">
          <div id="robot-dancer" class="robot-dancer">
            <div id="robot-assembly" class="robot-assembly" data-testid="robot-assembly">
              <button id="part-head" class="part-button part-head" type="button" aria-label="Cycle robot head" data-part="head" data-testid="part-head"></button>

              <div class="part-row part-middle-row">
                <button id="part-arm-left" class="part-button part-arm" type="button" aria-label="Cycle robot arms" data-part="arms" data-side="left" data-testid="part-arm-left"></button>
                <button id="part-body" class="part-button part-body" type="button" aria-label="Cycle robot body" data-part="body" data-testid="part-body">
                  <div id="exhaust-container" class="exhaust-container" aria-hidden="true"></div>
                </button>
                <button id="part-arm-right" class="part-button part-arm" type="button" aria-label="Cycle robot arms" data-part="arms" data-side="right" data-testid="part-arm-right"></button>
              </div>

              <button id="part-legs" class="part-button part-legs" type="button" aria-label="Cycle robot legs" data-part="legs" data-testid="part-legs"></button>
            </div>
          </div>
        </div>
      </section>

      <aside id="hide-seek-hud" class="hide-seek-hud is-hidden" aria-live="polite" data-testid="hide-seek-hud">
        <span class="hud-label">Hide and Seek</span>
        <span class="hud-stat" id="hide-seek-timer" data-testid="hide-seek-timer">30</span>
        <span class="hud-stat" id="hide-seek-score" data-testid="hide-seek-score">0</span>
      </aside>

      <nav id="controls" class="controls" aria-label="Robot controls" data-testid="controls"></nav>
    </main>

    <div id="toast" class="toast is-hidden" role="status" aria-live="polite" data-testid="toast"></div>
    <p id="status-live" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
